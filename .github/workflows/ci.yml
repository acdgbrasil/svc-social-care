name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Build and tests
    runs-on: ubuntu-22.04
    # Roda na MESMA imagem do Dockerfile/produção (swift:6.3-jammy). Antes o job
    # usava setup-swift fixado em 6.2 (resolvia 6.2.1), divergente do repo já em
    # 6.3 (tools-version, .swift-version 6.3.2, Dockerfile swift:6.3-jammy) — esse
    # descasamento de toolchain mascarava o comportamento real de produção e
    # causava "passa local (macOS 6.3) / falha no CI (Linux 6.2.1)".
    container: swift:6.3-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      # PRECISA vir antes do `Verify harness`. A imagem `swift:6.3-jammy` nao
      # traz `jq`, e os hooks o usam para ler o JSON do stdin — sem ele saem
      # com 2 (fail-closed, que e o comportamento correto de um guard). A
      # bateria de hooks entao reprovava TODOS os casos que esperam exit 0,
      # com 13 falhas que pareciam bug dos hooks e eram falta de dependencia.
      # `jq` tambem calcula o percentual do JSON do llvm-cov mais adiante.
      - name: Install jq
        run: apt-get update && apt-get install -y --no-install-recommends jq

      # Roda antes do build porque leva 0,2s e falha cedo: documentacao que
      # mente sobre o codigo e defeito, nao detalhe (ADR-042).
      - name: Verify harness
        run: ./scripts/check_harness.sh

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      # `report` roda a suite COM instrumentacao de cobertura e publica a leitura
      # no resumo do job. O que reprova este step e teste vermelho (o script roda
      # `swift test` sob `set -e`); o percentual e termometro, nao gate — serve
      # para enxergar qual camada esta descoberta, nao para bloquear merge.
      - name: Run tests + coverage report
        run: ./scripts/check_coverage.sh report

  sbom:
    name: SBOM
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    uses: acdgbrasil/.github/.github/workflows/reusable-sbom.yml@main
    permissions:
      contents: write

# NOTA: o Kodus (review de IA) foi DESCONTINUADO no projeto. O job `kodus-review`
# e o reusable workflow `reusable-kodus-review.yml` da org foram removidos — não
# há o que reativar. Se um dia entrar outra ferramenta de review automatizado,
# ela vem como job novo.
